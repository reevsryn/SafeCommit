name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    # ubuntu-latest is the platform the Action runs on. tree-sitter needs CGO,
    # so this job is the standing answer to "does the CGO build work on a
    # GitHub runner?" -- the open question when Go was chosen as the engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go build -o bin/safecommit ./cmd/safecommit
      - run: ./bin/safecommit --version
      - run: go test ./... -count=1

  python:
    # The eval harness is stdlib-only and must stay that way. Both interpreters
    # are exercised because internal/stdlib/modules.txt goes stale on a new
    # Python release, and tests/test_stdlib_list.py is what catches it.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -t . -s tests -v

  benchmark:
    # The published figures must stay reproducible from a clean checkout, with
    # no network and no credentials, against the pinned registry snapshot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: go build -o bin/safecommit ./cmd/safecommit
      - name: Development set must stay at zero noise
        run: |
          python -m bench eval \
            --tool "./bin/safecommit scan --no-repo-context --cache-dir corpus/registry-snapshot --offline" \
            --corpus corpus/known-good --corpus corpus/seeded \
            --fail-on-noise
