name: Verify prebuilt path
# TEMPORARY -- proves `@v1` resolves to the v1.0.1 prebuilt binary on a real runner.
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  prebuilt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reevsryn/SafeCommit@v1
        with:
          fail-on-findings: "false"
